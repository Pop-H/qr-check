<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QR判定システム</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { --ok-color: #28a745; --ng-color: #dc3545; --main-bg: #f8f9fa; }
        body { font-family: sans-serif; margin: 0; background: var(--main-bg); text-align: center; overflow-x: hidden; }
        header { background: #343a40; color: white; padding: 10px; font-weight: bold; font-size: 1.1rem; }
        
        .container { padding: 15px; max-width: 500px; margin: auto; }
        .config-section { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; text-align: left; }
        .config-section label { font-weight: bold; display: block; margin-top: 10px; color: #495057; }
        
        select, button { width: 100%; padding: 14px; font-size: 1.1rem; margin-top: 5px; border-radius: 6px; border: 1px solid #ced4da; box-sizing: border-box; }
        
        button { background: #007bff; color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 15px; }
        button.cancel { background: #6c757d; margin-top: 15px; }
        
        #reader { width: 100%; background: black; border-radius: 8px; overflow: hidden; display: none; }
        .zoom-info { display: none; color: #fff; background: rgba(0,0,0,0.7); padding: 8px; font-size: 0.85rem; margin-top: 5px; border-radius: 4px; }
        
        .result-card { display: none; padding: 20px; border-radius: 10px; color: white; margin-top: 20px; box-sizing: border-box; }
        .tekin-display { font-size: 5.5rem; font-weight: bold; display: block; margin: 10px 0; background: white; color: black; border-radius: 10px; letter-spacing: 2px; }
        
        .debug-box { background: rgba(0, 0, 0, 0.05); border: 1px dashed #6c757d; padding: 10px; text-align: left; font-family: monospace; font-size: 0.85rem; color: #333; margin-top: 15px; border-radius: 5px; word-break: break-all; }
        .debug-title { font-weight: bold; color: #000; border-bottom: 1px solid #ccc; margin-bottom: 5px; padding-bottom: 2px; }
        .res-debug { background: rgba(255, 255, 255, 0.2); border: 1px solid white; color: white; }
        .res-debug .debug-title { color: white; border-bottom: 1px solid white; }
        
        .step-badge { background: #e9ecef; color: #495057; padding: 5px 10px; border-radius: 20px; font-size: 0.9rem; display: inline-block; margin-bottom: 10px; font-weight: bold; border: 1px solid #ced4da; }
        .step-badge.active { background: #ffc107; color: #212529; border-color: #ffc107; }
    </style>
</head>
<body>

<header>QR合否判定システム（見本データ全表示版）</header>

<div class="container">
    <div id="setup-view" class="config-section">
        <h3 style="margin-top:0; border-bottom:2px solid #007bff; padding-bottom:5px;">【初期設定】</h3>
        <label for="honku-select">■ 本区の登録 (必須)</label>
        <select id="honku-select"><option value="">-- 本区を選択してください --</option></select>
        <label for="jiku-select">■ 次区の登録 (任意)</label>
        <select id="jiku-select"><option value="">-- 空白（指定なし） --</option></select>
        <button onclick="startProcess()">スキャン開始</button>
    </div>

    <div id="scanner-view" style="display:none;">
        <div style="margin-bottom: 10px;">
            <span id="badge-step1" class="step-badge active">1手目：かんばん待ち</span> ➔ 
            <span id="badge-step2" class="step-badge">2手目：見本待ち</span>
        </div>
        <h3 id="step-title" style="margin-top:0; color:#0056b3;">【1手目】サイクルかんばんをかざしてください</h3>
        
        <div id="reader"></div>
        <div id="zoom-tips" class="zoom-info">※細かいQRです。少し離してピントを合わせてください</div>
        <div id="live-debug" class="debug-box" style="display:none;"></div>
        <button class="cancel" onclick="resetAll()">キャンセル</button>
    </div>

    <div id="result-view" class="result-card">
        <div id="result-content"></div>
        <div id="result-debug" class="debug-box res-debug"></div>
        <button onclick="resetAll()" style="background:white; color:black; margin-top:25px; font-size:1.2rem;">次のスキャンへ</button>
    </div>
</div>

<script>
const LOCATION_OPTIONS = {
    honku: ["T120", "T122"],
    jiku: ["A200", "A210", "A710", "T600", "A011"]
};

let currentStep = 1; 
let targetHonku = "";
let targetJiku = "";
let html5QrCode;
let isLock = false; 

let debugData = {
    step1Raw: "",
    kanbanHonku: "未検出",
    kanbanJiku: "未検出",
    kanbanPartNo: "未検出",
    step2Raw: ""
};

window.onload = () => {
    const hSelect = document.getElementById('honku-select');
    const jSelect = document.getElementById('jiku-select');
    LOCATION_OPTIONS.honku.forEach(v => hSelect.add(new Option(v, v)));
    LOCATION_OPTIONS.jiku.forEach(v => jSelect.add(new Option(v, v)));
    if(localStorage.getItem('savedHonku')) hSelect.value = localStorage.getItem('savedHonku');
    if(localStorage.getItem('savedJiku')) jSelect.value = localStorage.getItem('savedJiku');
};

function startProcess() {
    targetHonku = document.getElementById('honku-select').value;
    targetJiku = document.getElementById('jiku-select').value; 
    if (!targetHonku) { alert("本区を入力してください。"); return; }
    localStorage.setItem('savedHonku', targetHonku);
    localStorage.setItem('savedJiku', targetJiku);

    document.getElementById('setup-view').style.display = 'none';
    document.getElementById('scanner-view').style.display = 'block';
    document.getElementById('reader').style.display = 'block';
    document.getElementById('zoom-tips').style.display = 'block';
    initScanner();
}

function initScanner() {
    html5QrCode = new Html5Qrcode("reader");
    const config = { 
        fps: 30, 
        qrbox: function(viewfinderWidth, viewfinderHeight) { return { width: viewfinderWidth * 0.8, height: viewfinderWidth * 0.8 }; },
        videoConstraints: { facingMode: "environment", width: { ideal: 4096, max: 4096 }, height: { ideal: 2160, max: 2160 } }
    };
    html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess)
    .then(() => {
        setTimeout(() => {
            const videoTrack = html5QrCode.getRunningTrack();
            if (videoTrack && typeof videoTrack.getCapabilities === 'function') {
                const capabilities = videoTrack.getCapabilities();
                if (capabilities.zoom) {
                    const targetZoom = capabilities.zoom.min + (capabilities.zoom.max - capabilities.zoom.min) * 0.25;
                    videoTrack.applyConstraints({ advanced: [{ zoom: targetZoom }] });
                }
            }
        }, 1000);
    }).catch(err => {
        html5QrCode.start({ facingMode: "environment" }, { fps: 20, qrbox: 250 }, onScanSuccess);
    });
}

function onScanSuccess(decodedText) {
    if (isLock) return; 

    if (currentStep === 1) {
        handleKanbanScan(decodedText);
    } else {
        handleMihonScan(decodedText);
    }
}

// ステップ1: サイクルかんばん
function handleKanbanScan(data) {
    if (data.startsWith("ISLB") || data.length < 100) { 
        return; 
    }

    isLock = true; 

    const tokens = data.trim().split(/\s+/);
    let scannedHonku = "";
    let scannedJiku = "";
    
    for (const token of tokens) {
        if (LOCATION_OPTIONS.honku.includes(token)) scannedHonku = token;
        if (LOCATION_OPTIONS.jiku.includes(token)) scannedJiku = token;
    }
    if (!scannedHonku) {
        const matchH = data.match(/[A-Z]\d{3}/g);
        if (matchH && matchH.length > 0) scannedHonku = matchH[0];
    }

    debugData.step1Raw = data;
    debugData.kanbanHonku = scannedHonku || "検出不能";
    debugData.kanbanJiku = scannedJiku || "空白または検出不能";

    if (scannedHonku !== targetHonku || (targetJiku !== "" && scannedJiku !== targetJiku)) {
        showFinalResult(false, `【NG】他部署のサイクルかんばんです。`);
        isLock = false;
        return;
    }

    let foundPartNo = "";
    for (const token of tokens) {
        if (token.startsWith("K0") && token.length >= 12) {
            foundPartNo = token.substring(2, 12); 
            break;
        }
    }
    if (!foundPartNo) {
        const k0Index = data.indexOf("K0");
        if (k0Index !== -1) foundPartNo = data.substring(k0Index + 2, k0Index + 12);
    }

    debugData.kanbanPartNo = foundPartNo || "検出不能";

    if (!foundPartNo) {
        alert("かんばんから品番コード(K0)を検出できませんでした。");
        isLock = false;
        return;
    }

    document.getElementById('badge-step1').classList.remove('active');
    document.getElementById('badge-step2').classList.add('active');
    document.getElementById('step-title').innerText = "【2手目】見本のQRコードをかざしてください";
    document.getElementById('step-title').style.color = "#d9381e";

    const liveDebug = document.getElementById('live-debug');
    liveDebug.style.display = "block";
    liveDebug.innerHTML = `<div class="debug-title">▼ 1手目：かんばん読込成功 (2手目受付中)</div>` +
                           `・抽出品番(10桁): <span style="color:blue;font-weight:bold;">${debugData.kanbanPartNo}</span>`;

    currentStep = 2;

    setTimeout(() => { isLock = false; }, 2000);
    vibrate(100);
}

// ステップ2: 見本QR（★最強の「大文字小文字無視・文字お掃除」突合へ）
function handleMihonScan(data) {
    if (data === debugData.step1Raw) {
        return;
    }

    isLock = true; 
    debugData.step2Raw = data;
    
    // かんばんから取った10桁（例: 0159874220）
    const target = debugData.kanbanPartNo;
    // 頭の0を除いた9桁（例: 1598744220 の場合は 598744220）
    const targetShort = target.startsWith("0") ? target.substring(1) : target;

    // 【お掃除処理】比較しやすくするため、大文字小文字をすべて「小文字」に統一し、ハイフンも消す
    const cleanMihonData = data.toLowerCase().replace(/-/g, "");
    const cleanTarget = target.toLowerCase();
    const cleanTargetShort = targetShort.toLowerCase();

    // 突合チェック
    let isMatch = false;
    if (cleanMihonData.includes(cleanTarget) || cleanMihonData.includes(cleanTargetShort)) {
        isMatch = true;
    }

    if (!isMatch) {
        showFinalResult(false, "使用するサイクルかんばんと見本が異なります。");
        isLock = false;
        return;
    }

    // 合格処理：テーキン抽出 (かんばん品番の末尾4桁の頭3文字)
    const tekin = target.substring(target.length - 4, target.length - 1); 

    let displayPartNo = target;
    if (displayPartNo.length === 10) {
        displayPartNo = displayPartNo.substring(1, 6) + "-" + displayPartNo.substring(6, 10);
    }

    showFinalResult(true, "生産ＯＫ<br>最後にテーキンの確認してください。", displayPartNo, tekin);
}

// 結果表示
function showFinalResult(isSuccess, msg, partNo = "", tekin = "") {
    if(html5QrCode) html5QrCode.stop();
    document.getElementById('scanner-view').style.display = 'none';
    
    const resView = document.getElementById('result-view');
    resView.style.display = 'block';
    resView.style.backgroundColor = isSuccess ? 'var(--ok-color)' : 'var(--ng-color)';

    let html = `<div class="status-msg">${isSuccess ? '【 ＯＫ 】' : '【 ＮＧ 】'}</div>`;
    html += `<div style="font-size:1.3rem; line-height:1.5; font-weight:bold;">${msg}</div>`;
    
    if (isSuccess) {
        html += `<div class="info-label">品番コード</div><div class="info-val">${partNo}</div>`;
        html += `<div class="info-label">テーキン</div><span class="tekin-display">${tekin}</span>`;
        vibrate([100, 50, 100]);
    } else {
        vibrate(500);
    }
    document.getElementById('result-content').innerHTML = html;

    // ★重要：NGの時は見本QRのデータを全て削らず表示する仕様
    const resDebug = document.getElementById('result-debug');
    resDebug.innerHTML = `<div class="debug-title">📊 突合データの内訳（検証用）</div>` +
                          `・かんばん品番 : <span style="font-weight:bold; font-size:1rem;">${debugData.kanbanPartNo}</span><br>` +
                          `─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─<br>` +
                          `【見本QRコードの全文字データ】<br>` +
                          `<div style="background:rgba(0,0,0,0.3); padding:8px; border-radius:4px; font-size:0.75rem; margin-top:5px; word-break:break-all;">${debugData.step2Raw}</div>`;
}

function resetAll() {
    if (html5QrCode && html5QrCode.isScanning) {
        html5QrCode.stop().finally(() => { location.reload(); });
    } else {
        location.reload();
    }
}

function vibrate(ms) {
    if (navigator.vibrate) navigator.vibrate(ms);
}
</script>
</body>
</html>
