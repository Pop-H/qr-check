<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QR判定ツール</title>
    <!-- QR読み取りライブラリ -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { --ok-color: #28a745; --ng-color: #dc3545; --main-bg: #f8f9fa; }
        body { font-family: sans-serif; margin: 0; background: var(--main-bg); text-align: center; overflow-x: hidden; }
        header { background: #343a40; color: white; padding: 10px; font-weight: bold; }
        
        .container { padding: 15px; max-width: 500px; margin: auto; }
        .config-section { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        select, button { width: 100%; padding: 12px; font-size: 1.1rem; margin-top: 10px; border-radius: 5px; border: 1px solid #ccc; }
        
        button { background: #007bff; color: white; border: none; font-weight: bold; cursor: pointer; }
        button.cancel { background: #6c757d; margin-top: 15px; }
        
        #reader { width: 100%; background: black; border-radius: 8px; overflow: hidden; display: none; }
        
        .result-card { display: none; padding: 20px; border-radius: 10px; color: white; margin-top: 20px; animation: flash 0.5s ease; }
        @keyframes flash { from { opacity: 0; } to { opacity: 1; } }

        .tekin-display { font-size: 5rem; font-weight: bold; display: block; margin: 10px 0; background: white; color: black; border-radius: 10px; }
        .info-label { font-size: 0.9rem; margin-top: 5px; opacity: 0.9; }
        .status-msg { font-weight: bold; margin-bottom: 10px; }
    </style>
</head>
<body>

<header>QR合否判定システム</header>

<div class="container">
    <!-- 初期設定画面 -->
    <div id="setup-view" class="config-section">
        <label>【初期設定】</label>
        <select id="honku-select">
            <option value="">-- 本区を選択 --</option>
        </select>
        <select id="jiku-select">
            <option value="">-- 次区を選択（任意） --</option>
        </select>
        <button onclick="startProcess()">スキャン開始</button>
    </div>

    <!-- カメラ画面 -->
    <div id="scanner-view" style="display:none;">
        <h3 id="step-title">サイクルかんばんを読み取ってください</h3>
        <div id="reader"></div>
        <button class="cancel" onclick="resetAll()">キャンセル</button>
    </div>

    <!-- 判定結果画面 -->
    <div id="result-view" class="result-card">
        <div id="result-content"></div>
        <button onclick="resetAll()" style="background:white; color:black; margin-top:20px;">次のスキャンへ</button>
    </div>
</div>

<script>
/** メンテ用：本区・次区のリスト **/
const LOCATION_OPTIONS = {
    honku: ["T120", "T600", "S011", "A100"],
    jiku: ["A200", "B300", "C400"]
};

let currentStep = 1; // 1: かんばん待ち, 2: 見本待ち
let targetHonku = "";
let kanbanPartNo = "";
let html5QrCode;

// 初期化：プルダウン生成と保存値の復元
window.onload = () => {
    const hSelect = document.getElementById('honku-select');
    const jSelect = document.getElementById('jiku-select');
    
    LOCATION_OPTIONS.honku.forEach(v => hSelect.add(new Option(v, v)));
    LOCATION_OPTIONS.jiku.forEach(v => jSelect.add(new Option(v, v)));

    if(localStorage.getItem('savedHonku')) hSelect.value = localStorage.getItem('savedHonku');
    if(localStorage.getItem('savedJiku')) jSelect.value = localStorage.getItem('savedJiku');
};

function startProcess() {
    targetHonku = document.getElementById('honku-select').value;
    if (!targetHonku) {
        alert("本区を入力してください。");
        return;
    }
    // 保存
    localStorage.setItem('savedHonku', targetHonku);
    localStorage.setItem('savedJiku', document.getElementById('jiku-select').value);

    document.getElementById('setup-view').style.display = 'none';
    document.getElementById('scanner-view').style.display = 'block';
    document.getElementById('reader').style.display = 'block';
    
    initScanner();
}

function initScanner() {
    html5QrCode = new Html5Qrcode("reader");
    const config = { fps: 10, qrbox: { width: 250, height: 250 } };
    
    html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess);
}

function onScanSuccess(decodedText) {
    if (currentStep === 1) {
        handleKanbanScan(decodedText);
    } else {
        handleMihonScan(decodedText);
    }
}

// ステップ1: サイクルかんばん読み取り
function handleKanbanScan(data) {
    // 見本用QR（ISLB開始）を先に読んだ場合のチェック
    if (data.startsWith("ISLB")) {
        alert("サイクルかんばんから読み込んでください。");
        return;
    }

    // 本区の抽出 (T120の形式：アルファベット1文字+数字3文字)
    // 仕様：データ内の「 T120 」などのパターンを探す。JAMA規格の固定位置付近を想定
    const honkuMatch = data.match(/[A-Z]\d{3}/g);
    const scannedHonku = honkuMatch ? honkuMatch[0] : "";

    if (scannedHonku !== targetHonku) {
        showFinalResult(false, `読み込んだサイクルかんばん（${scannedHonku}）は他部署のサイクルかんばんです。`);
        return;
    }

    // 品番の抽出 (K + 10桁)
    const kIndex = data.indexOf("K");
    if (kIndex === -1) {
        alert("品番情報が見つかりません。正しいかんばんか確認してください。");
        return;
    }
    kanbanPartNo = data.substring(kIndex + 1, kIndex + 11); // ハイフンなし10桁

    // OKなら次のステップへ
    currentStep = 2;
    document.getElementById('step-title').innerText = "見本のQRコードを読み取ってください";
    vibrate(100);
}

// ステップ2: 見本QR読み取り
function handleMihonScan(data) {
    // 品番の抽出 (ISLB以降の11桁 159874-3050)
    const partMatch = data.match(/\d{6}-\d{4}/);
    if (!partMatch) {
        alert("見本QRから品番を読み取れません。");
        return;
    }
    const mihonPartNoRaw = partMatch[0];
    const mihonPartNoClean = mihonPartNoRaw.replace("-", "");

    if (mihonPartNoClean !== kanbanPartNo) {
        showFinalResult(false, "使用するサイクルかんばんと見本が異なります。");
        return;
    }

    // 全て一致
    const tekin = mihonPartNoRaw.substring(7, 10); // ハイフン後4桁の頭3文字
    showFinalResult(true, "生産OK<br>最後にテーキンの確認してください。", mihonPartNoRaw, tekin);
}

function showFinalResult(isSuccess, msg, partNo = "", tekin = "") {
    html5QrCode.stop();
    document.getElementById('scanner-view').style.display = 'none';
    const resView = document.getElementById('result-view');
    resView.style.display = 'block';
    resView.style.backgroundColor = isSuccess ? 'var(--ok-color)' : 'var(--ng-color)';

    let html = `<div class="status-msg">${isSuccess ? '【一致】' : '【不一致】'}</div>`;
    html += `<div>${msg}</div>`;
    
    if (isSuccess) {
        html += `<div class="info-label">品番コード</div><div>${partNo}</div>`;
        html += `<div class="info-label">テーキン</div><span class="tekin-display">${tekin}</span>`;
        vibrate([100, 50, 100]);
    } else {
        vibrate(500);
    }

    document.getElementById('result-content').innerHTML = html;
}

function resetAll() {
    if (html5QrCode) {
        html5QrCode.stop().finally(() => {
            location.reload();
        });
    } else {
        location.reload();
    }
}

function vibrate(ms) {
    if (navigator.vibrate) navigator.vibrate(ms);
}
</script>
</body>
</html>
