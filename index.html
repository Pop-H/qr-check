<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>【最強画質】QR読取テスト</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 0; background: #000; color: #fff; text-align: center; }
        #reader { width: 100vw; height: 70vh; background: black; }
        #result-view { position: fixed; bottom: 0; left: 0; width: 100%; height: 30vh; background: #fff; color: #000; overflow-y: scroll; padding: 10px; box-sizing: border-box; }
        h3 { margin: 10px 0; color: #fff; }
        button { background: #007bff; color: white; padding: 10px 20px; font-size: 1.1rem; border-radius: 5px; margin: 5px; }
        .success-box { background: #d4edda; color: #155724; padding: 5px; border-radius: 3px; font-size: 0.8rem; margin-top: 5px;}
    </style>
</head>
<body>

<h3>【緊急テスト】QRをかざしてください</h3>
<p style="font-size: 0.8rem; margin: 0 10px 10px 10px;">最強の画質設定でカメラを起動します。<br>少し離してピントを合わせてください。</p>

<div id="reader"></div>

<div id="result-view">
    <div><strong>読み取り結果：</strong></div>
    <div id="scan-history"></div>
    <button onclick="clearHistory()" style="margin-top:10px;">履歴をクリア</button>
</div>

<script>
    let html5QrCode;

    // 最強画質設定でカメラを起動する関数
    function start最強Scanner() {
        if (html5QrCode && html5QrCode.isScanning) {
            html5QrCode.stop();
        }

        html5QrCode = new Html5Qrcode("reader");

        // カメラ設定：これまでの設定よりもさらに強力な、端末の最大解像度を要求する
        const config = {
            fps: 30, // FPSを上げて滑らかに
            qrbox: function (viewfinderWidth, viewfinderHeight) {
                // 読み取り枠を少し大きめに
                return { width: viewfinderWidth * 0.85, height: viewfinderWidth * 0.85 };
            },
            // 最強画質（max：フルHDまたは4K画質を強制要求）
            videoConstraints: {
                facingMode: "environment",
                width: { ideal: 4096, max: 4096 },  // 端末が出せる最大解像度を要求
                height: { ideal: 2160, max: 2160 }  
            }
        };

        html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess)
            .then(() => {
                // カメラ起動成功後に自動ズーム（端末が対応している場合）
                setTimeout(() => {
                    const videoTrack = html5QrCode.getRunningTrack();
                    if (videoTrack && typeof videoTrack.getCapabilities === 'function') {
                        const capabilities = videoTrack.getCapabilities();
                        if (capabilities.zoom) {
                            // 最大ズームの25%に設定
                            const targetZoom = capabilities.zoom.min + (capabilities.zoom.max - capabilities.zoom.min) * 0.25;
                            videoTrack.applyConstraints({ advanced: [{ zoom: targetZoom }] });
                        }
                    }
                }, 1000);
            })
            .catch(err => {
                // 最強設定で起動できなかった場合（古い端末など）、通常画質で再トライ
                console.error("最強設定で起動できませんでした。通常画質で起動します。", err);
                const fallbackConfig = {
                    fps: 10,
                    qrbox: { width: 250, height: 250 },
                    videoConstraints: { facingMode: "environment" }
                };
                html5QrCode.start({ facingMode: "environment" }, fallbackConfig, onScanSuccess);
            });
    }

    // 読み取り成功時の処理：判定ロジックなし。そのまま表示するだけ
    function onScanSuccess(decodedText) {
        // 短いスキャン間隔で何度も同じものを読まないように
        vibrate(100);

        // 文字数（最初の10文字と長さ）を表示
        let truncated = decodedText.substring(0, 15) + "...";
        if (decodedText.length < 15) truncated = decodedText;

        const historyEl = document.getElementById('scan-history');
        const timestamp = new Date().toLocaleTimeString();
        historyEl.innerHTML = `<div class="success-box"><strong>[${timestamp}] 成功</strong> (長さ: ${decodedText.length})<br>頭15文字: ${truncated}<br></div>` + historyEl.innerHTML;

        console.log("読み取り成功:", decodedText);
    }

    function clearHistory() {
        document.getElementById('scan-history').innerHTML = "";
    }

    function vibrate(ms) {
        if (navigator.vibrate) navigator.vibrate(ms);
    }

    // ページロード時に自動起動
    window.onload = start最強Scanner;

</script>
</body>
</html>
